# Databricks Asset Bundle for the retail medallion pipeline.
# Targets: dev (default) and prod. Notebooks run as GIT tasks (Repo-aware).
# CLI: databricks bundle deploy [--target dev] && databricks bundle run jb_medallion

bundle:
  name: de-proy1-databricks-medallion

variables:
  env:
    description: Deployment target name (dev | prod)
    default: dev
  catalog:
    description: Unity Catalog catalog (one per environment)
    default: retail_lakehouse
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  volume:
    default: retail_volumes
  data_location:
    description: Where raw files land (volume | workspace)
    default: volume
  repo_path:
    description: Absolute path of the repo checkout in Databricks Repos
    default: /Repos/ibasulto@.dev/de-proy1-databricks-medallion-architecture
  as_of:
    description: Optional gold as-of date (YYYY-MM-DD); empty = full range
    default: ""

workspace:
  root_path: /Shared/bundles/${bundle.name}/${bundle.target}-${workspace.current_user.id}

artifacts:
  src_zip:
    type: archive
    path: src
    archive_size_limit: 10

resources:
  jobs:
    jb_medallion_${var.env}:
      name: medallion_${var.env}_retail
      description: Retail medallion pipeline (bronze -> silver -> gold + quality gate)
      tags:
        project: de-proy1-databricks-medallion
        env: ${var.env}
      job_clusters:
        - job_cluster_key: shared
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.databricks.adaptive.autoOptimizeShuffle.enabled: "true"
              spark.dq.threshold: 0.05
              spark.dab.catalog: ${var.catalog}
              spark.dab.bronze_schema: ${var.bronze_schema}
              spark.dab.silver_schema: ${var.silver_schema}
              spark.dab.gold_schema: ${var.gold_schema}
              spark.dab.volume: ${var.volume}
              spark.dab.data_location: ${var.data_location}
      tasks:
        - task_key: setup_environment
          notebook_task:
            notebook_path: notebooks/00_setup
            base_parameters:
              repo_path: ${var.repo_path}
          job_cluster_key: shared
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: notebooks/01_bronze_ingest
            base_parameters:
              repo_path: ${var.repo_path}
              use_autoloader: "false"
          job_cluster_key: shared
          depends_on:
            - task_key: setup_environment
        - task_key: silver_transform
          notebook_task:
            notebook_path: notebooks/02_silver_transform
            base_parameters:
              repo_path: ${var.repo_path}
          job_cluster_key: shared
          depends_on:
            - task_key: bronze_ingestion
        - task_key: gold_build
          notebook_task:
            notebook_path: notebooks/03_gold_build
            base_parameters:
              repo_path: ${var.repo_path}
              as_of: ${var.as_of}
          job_cluster_key: shared
          depends_on:
            - task_key: silver_transform
        - task_key: quality_gate
          notebook_task:
            notebook_path: notebooks/04_quality_checks
            base_parameters:
              repo_path: ${var.repo_path}
          job_cluster_key: shared
          depends_on:
            - task_key: gold_build

targets:
  dev:
    mode: development
    default: true
    variables:
      env: dev
  prod:
    mode: production
    variables:
      env: prod