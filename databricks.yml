# Databricks Asset Bundle for the retail medallion pipeline.
# Targets: dev (default) and prod. Notebooks run as GIT tasks (Repo-aware).
# CLI: databricks bundle deploy [--target dev] && databricks bundle run jb_medallion

bundle:
  name: de-proy1-databricks-medallion

variables:
  env:
    description: Deployment target name (dev | prod)
    default: dev
  catalog:
    description: Unity Catalog catalog (one per environment)
    default: workspace
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  volume:
    default: retail_volumes
  data_location:
    description: Where raw files land (volume=UC Premium | workspace=Community Edition)
    default: volume
  uc:
    description: Enable Unity Catalog (true=Premium | false=Community Edition)
    default: "true"
  repo_path:
    description: Absolute path of the repo checkout in Databricks Repos
    default: /Workspace/Repos/ignacio.basulto@gmail.com/de-proy1-databricks-medallion-architecture
  as_of:
    description: Optional gold as-of date (YYYY-MM-DD); empty = full range
    default: ""

workspace:
  root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    jb_medallion:
      name: medallion_${var.env}_retail
      description: Retail medallion pipeline (bronze -> silver -> gold + quality gate)
      tags:
        project: de-proy1-databricks-medallion
        env: ${var.env}
      tasks:
        - task_key: setup_environment
          notebook_task:
            notebook_path: notebooks/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              volume: ${var.volume}
              data_location: ${var.data_location}
              uc: ${var.uc}

              repo_path: ${var.repo_path}
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: notebooks/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              volume: ${var.volume}
              data_location: ${var.data_location}
              uc: ${var.uc}

              repo_path: ${var.repo_path}
              use_autoloader: "false"
          depends_on:
            - task_key: setup_environment
        - task_key: silver_transform
          notebook_task:
            notebook_path: notebooks/02_silver_transform.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              volume: ${var.volume}
              data_location: ${var.data_location}
              uc: ${var.uc}

              repo_path: ${var.repo_path}
          depends_on:
            - task_key: bronze_ingestion
        - task_key: gold_build
          notebook_task:
            notebook_path: notebooks/03_gold_build.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              volume: ${var.volume}
              data_location: ${var.data_location}
              uc: ${var.uc}

              repo_path: ${var.repo_path}
              as_of: ${var.as_of}
          depends_on:
            - task_key: silver_transform
        - task_key: quality_gate
          notebook_task:
            notebook_path: notebooks/04_quality_checks.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              volume: ${var.volume}
              data_location: ${var.data_location}
              uc: ${var.uc}

              repo_path: ${var.repo_path}
          depends_on:
            - task_key: gold_build

targets:
  dev:
    mode: development
    default: true
    variables:
      env: dev
      catalog: workspace
      data_location: volume
      uc: "true"
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prod
      data_location: volume
      uc: "true"