name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Smoke test - generate a mini dataset
        run: |
          python scripts/generate_data.py --mini --out /tmp/raw
          python -c "import gzip,pathlib; p=pathlib.Path('/tmp/raw/_manifest.json'); assert p.exists(); print('manifest ok')"